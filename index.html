<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Chamada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-tabela">
        <h2>Lista de Chamada</h2>
        <table>
            <thead>
                <tr>
                    <th>Nº</th>
                    <th>Nome do Aluno</th>
                    <th>Horário</th>
                    <th>Presença</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01</td>
                    <td>Ana Silva</td>
                    <td>07:30</td>
                    <td><span class="status presente">Presente</span></td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>Bruno Santos</td>
                    <td>07:32</td>
                    <td><span class="status presente">Presente</span></td>
                </tr>
                <tr>
                    <td>03</td>
                    <td>Carlos Lima</td>
                    <td>--:--</td>
                    <td><span class="status ausente">Ausente</span></td>
                </tr>
                <tr>
                    <td>04</td>
                    <td>Diana Costa</td>
                    <td>07:35</td>
                    <td><span class="status presente">Presente</span></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
